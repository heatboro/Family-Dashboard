<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FFFFFF;
    --bg: #E3EDF3;
    --ink: #2B3A42;
    --ink-soft: #6B7B84;
    --rule: #D8E2E7;

    --teal: #4F7C8C;
    --teal-soft: #DCE8ED;
    --mustard: #C6963C;
    --mustard-soft: #F1E4C7;
    --rust: #9C5847;
    --rust-soft: #EEDCD5;
    --pink: #C1516B;
    --pink-soft: #F7DEE5;

    --yellow: #C9A227;
    --yellow-soft: #FBF0C8;
    --yellow-page: #FFFBF0;

    --green: #5B7F5E;
    --green-soft: #E1EEE0;
    --green-page: #F5F9F3;

    --purple: #7C5C8C;
    --purple-soft: #EBE0F0;
    --purple-page: #F8F4FA;

    --rust-page: #FDF3EF;
  }

  nav.tabs button[data-tab="bucketlist"].active{ border-bottom-color: var(--rust); }

  .theme-rust .day-title{ background: var(--rust-soft); color: #6B3226; }
  .theme-rust .routine-list input[type="checkbox"]{ border-color: var(--rust); }
  .theme-rust .routine-list input[type="checkbox"]:checked{ background: var(--rust); border-color: var(--rust); }
  .theme-rust{ background: var(--rust-page); padding: 20px; border-radius: 10px; }

  .bucket-title{
    font-family: "Dancing Script", "Brush Script MT", cursive;
    font-weight: 700;
    font-size: 42px;
    color: var(--ink);
    text-align: center;
    margin-bottom: 18px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    padding: 24px 24px 60px;
  }

  .frame{ max-width: 1080px; margin: 0 auto; }

  h1, h2 { font-family: Georgia, "Iowan Old Style", serif; font-weight: normal; margin: 0; }

  .month-label{
    font-family: "Dancing Script", "Brush Script MT", cursive;
    font-weight: 700;
    font-size: 42px;
    color: var(--ink);
    text-align: center;
    margin-bottom: 10px;
  }

  .week-strip{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .week-strip .day{
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    text-align:center;
    padding: 8px 4px;
  }
  .week-strip .day .dow{ font-size: 11px; color: var(--ink-soft); letter-spacing: 0.3px; }
  .week-strip .day .num{ font-family: Georgia, serif; font-size: 20px; margin-top: 2px; }

  .reminders{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .bubble{
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    line-height: 1.3;
    border: 1px solid transparent;
  }
  .bubble.teal{ background: var(--teal-soft); color: var(--teal); border-color: var(--teal); }
  .bubble.pink{ background: var(--pink-soft); color: var(--pink); border-color: var(--pink); }
  .bubble.rust{ background: var(--rust-soft); color: var(--rust); border-color: var(--rust); }
  .bubble.purple{ background: var(--purple-soft); color: var(--purple); border-color: var(--purple); }
  .bubble.green{ background: var(--green-soft); color: var(--green); border-color: var(--green); }

  nav.tabs{
    display:flex;
    gap: 6px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 0;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  nav.tabs button{
    font-family: Georgia, serif;
    font-size: 16px;
    background: none;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    color: var(--ink-soft);
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  nav.tabs button.active{ color: var(--ink); }
  nav.tabs button[data-tab="overview"].active{ border-bottom-color: var(--teal); }
  nav.tabs button[data-tab="gwen"].active{ border-bottom-color: var(--yellow); }
  nav.tabs button[data-tab="kevin"].active{ border-bottom-color: var(--green); }
